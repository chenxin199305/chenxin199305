name: Update README cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PAT_1: ${{ secrets.PAT_1 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate stats card
        if: env.PAT_1 != ''
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=github
          path: assets/stats.svg
          token: ${{ env.PAT_1 }}
          core_version: 2.2.0
          fail_on_error: true

      - name: Generate top languages card
        if: env.PAT_1 != ''
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true
          path: assets/top-langs.svg
          token: ${{ env.PAT_1 }}
          core_version: 2.2.0
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg
          if git diff --cached --quiet; then
            echo "No card changes"
            exit 0
          fi
          git commit -m "chore: update README cards"
          git push
